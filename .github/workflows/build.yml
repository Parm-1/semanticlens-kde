name: Native CPU build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install documented dependencies in the disposable container
        run: >-
          pacman -Syu --noconfirm --needed git cmake ninja python qt6-base
          qt6-declarative kirigami qqc2-desktop-style breeze krunner kiconthemes extra-cmake-modules
          poppler tesseract tesseract-data-eng desktop-file-utils appstream
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify frozen demo inputs and Python helpers
        run: |
          sha256sum -c benchmark/SHA256SUMS
          python3 -m py_compile tools/*.py
          desktop-file-validate packaging/org.kdeindex.Search.desktop
          appstreamcli validate --no-net packaging/org.kdeindex.Search.metainfo.xml
      - name: Fetch pinned CPU runtime source
        run: ./tools/runtime_setup.sh
      - name: Build application, service, producer and KRunner module
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
      - name: Stage installation without model weights or user data
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          test -x stage/usr/bin/kde-index
          test -x stage/usr/bin/kde-index-service
          test -x stage/usr/bin/semanticlens-media
          test -x stage/usr/bin/embedding-probe
          test -f stage/usr/lib/qt6/plugins/kf6/krunner/kde-index-runner.so
          test -f stage/usr/share/licenses/kde-index/stb-image-MIT.txt
          test ! -d stage/usr/include
          test ! -f stage/usr/lib/libllama.a
      - name: Load the native interface without downloads or user data
        run: |
          mkdir -p ci-profile
          QT_QPA_PLATFORM=offscreen timeout 15s build/bin/kde-index \
            --models "$PWD/ci-profile/models" --data-dir "$PWD/ci-profile/data" \
            --socket "$PWD/ci-profile/search.sock" \
            --capture "$PWD/ci-profile/window.png"
          test -s ci-profile/window.png
